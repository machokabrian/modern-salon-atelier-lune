<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Salon admin</title>
<style>
:root{color-scheme:light dark;--line:color-mix(in srgb,CanvasText 18%,transparent);--soft:color-mix(in srgb,CanvasText 6%,transparent);--ok:#2C7A4B}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:Canvas;color:CanvasText;padding-bottom:7rem}
main{max-width:760px;margin:0 auto;padding:1rem}
h1{font-size:1.6rem;margin:1rem 0 .2rem}
.muted,small{color:color-mix(in srgb,CanvasText 62%,transparent)}
details{border:1px solid var(--line);border-radius:16px;margin:1rem 0;padding:.2rem 1rem 1rem}
summary{font-weight:700;padding:.8rem 0;cursor:pointer}
.f{display:grid;gap:.25rem;margin:.7rem 0;font-size:.92rem;font-weight:600}
.f small{font-weight:400}
input,select,textarea{width:100%;padding:.65rem .75rem;border:1px solid var(--line);border-radius:10px;background:Canvas;color:CanvasText;font:inherit;font-weight:400}
input[type=color]{padding:.15rem;height:2.6rem}
input[type=checkbox]{width:auto}
textarea{min-height:5rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 .8rem}
.row{border:1px solid var(--line);border-radius:12px;padding:.2rem .8rem .8rem;margin:.7rem 0;background:var(--soft)}
.chk{display:flex;gap:.5rem;align-items:center;font-weight:600;margin:.7rem 0}
img.pv{height:70px;width:100%;object-fit:cover;border-radius:10px;margin-top:.3rem}
button{font:inherit;font-weight:600;border-radius:999px;border:1px solid var(--line);background:Canvas;color:CanvasText;padding:.6rem 1.2rem;cursor:pointer}
button.main{background:CanvasText;color:Canvas;border-color:CanvasText}
button.x{padding:.35rem .9rem;font-size:.85rem}
.bar{position:fixed;left:0;right:0;bottom:0;background:Canvas;border-top:1px solid var(--line);padding:.8rem 1rem calc(.8rem + env(safe-area-inset-bottom,0px))}
.bar>div{max-width:760px;margin:0 auto;display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
#msg{flex-basis:100%;font-size:.92rem;min-height:1.3em}
#msg.bad{color:#C0392B}#msg.good{color:var(--ok)}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>Salon admin</h1>
  <p class="muted">Edit anything shown on your website, then press Publish. Your site updates about a minute later.</p>
  <div id="sections"></div>
</main>
<div class="bar"><div>
  <button class="main" id="publish" type="button">Publish changes</button>
  <button id="download" type="button">Download config.json</button>
  <button id="import" type="button">Import file</button>
  <input id="file" type="file" accept=".json,application/json" hidden>
  <p id="msg" role="status"></p>
</div></div>
<script src="admin.js"></script>
</body>
</html>
